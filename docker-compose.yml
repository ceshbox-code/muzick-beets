services:
  beets:
    image: lscr.io/linuxserver/beets:latest
    container_name: beets
    environment:
      - PUID=1026
      - PGID=100
      - TZ=Europe/Berlin
    volumes:
      - /volume1/docker/beets/config:/config
      - /volume1/music_clean:/music
      - /volume1/music:/downloads:ro
    ports:
      - 8337:8337
    ports:
      - 8337:8337
    restart: unless-stopped
